variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  PIXI_HOME: .pixi
  IPFS_GATEWAY: https://ipfs.io

stages: [build]

.build: &build
  stage: build
  tags: [conda]
  cache:
    - key: cache-default
      paths: [.jupyter_cache]
    - key:
        files: [pixi.lock]
      paths: [.pixi]
  before_script:
    - curl -fsSL https://pixi.sh/install.sh | sh
    - export PATH="${PATH}:${PIXI_HOME}/bin"
    - pixi install
  script:
    - pixi run render
  artifacts:
    paths: [public]
    expire_in: 20min

pages:
  extends: .build
  environment:
    name: production
    url: https://$CI_PROJECT_NAMESPACE.$CI_PAGES_DOMAIN/$CI_PROJECT_NAME
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

preview:
  extends: .build
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: https://$CI_PROJECT_NAMESPACE.$CI_PAGES_DOMAIN/-/$CI_PROJECT_NAME/-/jobs/$CI_JOB_ID/artifacts/public/index.html
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
