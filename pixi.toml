[workspace]
name = "lecture-materials"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[pypi-dependencies]
aiohttp = "*"
cartopy = "<2"
easygems = "*"
flox = "*"
intake = "<2"
intake-xarray = "<2"
ipfsspec = "*"
julia = "*"
jupyter = "*"
jupyter-cache = "*"
matplotlib = "*"
xarray = "*"
zarr = "*"

[dependencies]
python = ">=3.13"
quarto = "==1.7.33"

[tasks]
render = { cmd = ["quarto", "render", "index.qmd"] }
preview = { cmd = ["quarto", "preview", "index.qmd", "--no-navigate"] }
